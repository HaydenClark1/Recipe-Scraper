version: '3.9'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recipe
      POSTGRES_PASSWORD: recipe
      POSTGRES_DB: recipe_local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  frontend:
    build:
      context: ./frontend
    ports:
      - "19000:19000"  # Metro bundler
      - "19001:19001"  # LAN
      - "19002:19002"  # Dev tools
    volumes:
      - ./frontend:/app
    command: npx expo start --tunnel
    stdin_open: true
    tty: true

  backend:
    build:
      context: ./backend
    ports:
      - "7000:7000"
    volumes:
      - ./backend:/app
    command: node server.js
    depends_on:
      - db

volumes:
  pgdata:
